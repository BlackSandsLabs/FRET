name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please redact any MAC addresses or SSIDs that are sensitive.
  - type: input
    id: version
    attributes:
      label: FRET version
      description: Shown in Settings → About
      placeholder: "1.2.0"
    validations:
      required: true
  - type: dropdown
    id: receiver
    attributes:
      label: Receiver
      options: [M5StickC Plus2, M5Stack StickS3, Demo mode only, Other]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Setup / install, Flashing firmware, Stick (screen / crash), Connection, Identification, Distance, Case / export, UI, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you saw.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / error text
      description: Paste error output, or attach firmware\boot_log.txt from capture_log.bat.
      render: text
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
