; FRET capture firmware.
;   m5stack-sticks3   M5Stack StickS3 (ESP32-S3-PICO-1-N8R8, USB-CDC)
;   m5stickc-plus2    M5StickC Plus2 (ESP32-PICO-V3-02, CH9102 USB-serial)
; Build & flash:  pio run -e <env> -t upload   (or double-click flash_stick.bat)
; StickS3 settings follow M5Stack's published PlatformIO config (SKU K150).

[platformio]
default_envs = m5stack-sticks3

[env:m5stack-sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    '-DFRET_BOARD="M5Stack StickS3"'
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
lib_deps =
    M5Unified=https://github.com/m5stack/M5Unified
    M5PM1=https://github.com/m5stack/M5PM1
    h2zero/NimBLE-Arduino@^1.4.3

[env:m5stickc-plus2]
platform = espressif32@6.12.0
board = m5stick-c
framework = arduino
board_build.partitions = huge_app.csv
upload_speed = 921600
monitor_speed = 921600
build_flags =
    '-DFRET_BOARD="M5StickC Plus2"'
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
lib_deps =
    M5Unified=https://github.com/m5stack/M5Unified
    h2zero/NimBLE-Arduino@^1.4.3
